# WARNING: 不要运行 xcodegen generate！
# xcodegen 2.44.1 生成 objectVersion=77 格式，不会生成 PBXResourcesBuildPhase，
# 导致 Assets.xcassets 不会被打包进 app bundle。
# 当前 pbxproj 已手动修补添加了 Resources build phase。
# 如需修改项目配置，请直接编辑 .xcodeproj/project.pbxproj。
name: LanguageOptimizer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    DEVELOPMENT_TEAM: 2N5PF5L8LT
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    SWIFT_VERSION: '6.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.example.LanguageOptimizer
    INFOPLIST_FILE: Sources/LanguageOptimizer/Info.plist
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  LanguageOptimizer:
    type: application
    platform: macOS
    sources:
      - Sources/LanguageOptimizer
    resources:
      - path: Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Sources/LanguageOptimizer/Info.plist
    dependencies: []
